[project]
name = "photo-organiser"
version = "0.1.0"
description = "Photo album organization desktop application with tile-based UI and drag-and-drop support"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow>=10.0.0",
    "watchdog>=3.0.0",
    "customtkinter>=5.2.0",
    "rawpy>=0.18.0",
    "imagecodecs>=2023.0.0",
    "tkinterdnd2>=0.3.0",
    "exifread>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
